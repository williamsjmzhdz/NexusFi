<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background: indigo gradient rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Chart area fill below the N-line -->
  <path d="M16,82 L16,25 L76,75 L76,25 L76,82 Z" fill="url(#area)"/>

  <!-- Subtle horizontal chart reference lines -->
  <line x1="10" y1="25" x2="90" y2="25" stroke="white" stroke-width="0.75" stroke-opacity="0.18" stroke-dasharray="3,6"/>
  <line x1="10" y1="75" x2="90" y2="75" stroke="white" stroke-width="0.75" stroke-opacity="0.18" stroke-dasharray="3,6"/>

  <!-- N-shaped chart line: up → diagonal down → up again -->
  <polyline
    points="16,75 16,25 76,75 76,25"
    stroke="white"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Chart nodes at each turning point -->
  <circle cx="16" cy="75" r="4.5" fill="white" fill-opacity="0.5"/>
  <circle cx="16" cy="25" r="4.5" fill="white" fill-opacity="0.8"/>
  <circle cx="76" cy="75" r="4.5" fill="white" fill-opacity="0.8"/>
  <!-- Final peak — the destination, full white, largest -->
  <circle cx="76" cy="25" r="6.5" fill="white"/>
</svg>
